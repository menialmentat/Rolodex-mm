<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolodex PWA v4</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <!-- Header / Dual Calendar Navigation -->
    <header class="app-header">
      <div class="calendar-toggle">
        <span id="primary-date-display" class="date-badge primary">--</span>
        <span id="secondary-date-display" class="date-badge secondary">--</span>
      </div>
      <div class="header-controls">
        <button id="prev-date-btn">&larr;</button>
        <button id="today-btn">Today</button>
        <button id="next-date-btn">&rarr;</button>
      </div>
    </header>

    <!-- Navigation Tabs (Logs & Journal revert to V2 baseline/removed from V4 updates) -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="people">People</button>
      <button class="tab-btn" data-tab="events">Events</button>
      <button class="tab-btn" data-tab="tasks">Tasks</button>
      <button class="tab-btn" data-tab="reminders">Reminders</button>
      <button class="tab-btn" data-tab="week">Week</button>
    </nav>

    <!-- Main Content Area -->
    <main class="tab-content">
      
      <!-- HOME TAB -->
      <section id="tab-home" class="tab-pane active">
        <div class="section-header">
          <h2>Agenda Summary</h2>
          <label class="toggle-switch">
            <input type="checkbox" id="agenda-reminder-toggle">
            <span class="slider"></span>
            <span class="toggle-label">Reminders Only</span>
          </label>
        </div>
        <div id="agenda-summary-container" class="card">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- PEOPLE TAB -->
      <section id="tab-people" class="tab-pane">
        <div class="section-header">
          <h2>People</h2>
          <button id="add-person-btn" class="btn primary">+ Add Person</button>
        </div>
        <div class="search-bar">
          <input type="text" id="person-search-input" placeholder="Search by name or alias...">
        </div>
        <div id="people-list-container" class="people-grid">
          <!-- Populated dynamically (Names only, code hidden; photo full-page click) -->
        </div>
      </section>

      <!-- EVENTS TAB -->
      <section id="tab-events" class="tab-pane">
        <div class="section-header">
          <h2>Events</h2>
          <button id="add-event-btn" class="btn primary">+ New Event</button>
        </div>
        <div id="events-list-container" class="card">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- TASKS TAB -->
      <section id="tab-tasks" class="tab-pane">
        <div class="section-header">
          <h2>Tasks</h2>
          <button id="add-task-btn" class="btn primary">+ New Task</button>
        </div>
        <div id="tasks-day-view-container">
          <div class="task-group">
            <h3>Today</h3>
            <div id="tasks-today-list" class="task-list"></div>
          </div>
          <div class="task-group">
            <h3>This Week</h3>
            <div id="tasks-week-list" class="task-list"></div>
          </div>
          <div class="task-group">
            <h3>This Month</h3>
            <div id="tasks-month-list" class="task-list"></div>
          </div>
          <div class="task-group">
            <h3>This Quarter</h3>
            <div id="tasks-quarter-list" class="task-list"></div>
          </div>
        </div>
      </section>

      <!-- REMINDERS TAB -->
      <section id="tab-reminders" class="tab-pane">
        <div class="section-header">
          <h2>Reminders</h2>
          <button id="add-reminder-btn" class="btn primary">+ New Reminder</button>
        </div>
        <div class="reminder-score-card">
          <span>Completion Score (to yesterday): </span>
          <strong id="reminder-score-val">0%</strong>
        </div>
        <div id="reminders-list-container" class="card">
          <!-- Details removed, % completion score shown -->
        </div>
      </section>

      <!-- WEEK VIEW TAB -->
      <section id="tab-week" class="tab-pane">
        <div class="section-header">
          <h2>Week View</h2>
        </div>
        <div id="week-view-container" class="week-grid">
          <!-- Refined order, last 10 events highlighted red, reminders toggleable -->
        </div>
      </section>

    </main>
  </div>

  <!-- Full-Page Photo Modal -->
  <div id="photo-modal" class="modal light-box">
    <span id="close-photo-modal" class="modal-close">&times;</span>
    <img id="full-page-photo" src="" alt="Full View">
  </div>

  <!-- Generic Item / Input Modal -->
  <div id="form-modal" class="modal">
    <div class="modal-content card">
      <span id="close-form-modal" class="modal-close">&times;</span>
      <h3 id="modal-title">Form</h3>
      <form id="generic-form">
        <div id="form-fields-container"></div>
        <button type="submit" class="btn primary mt-1">Save</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
